waypoint_mover:
  ros__parameters:
    planning_group: ur_manipulator
    velocity_scaling: 0.3
    acceleration_scaling: 0.3
    # Set true to loop through the waypoints forever
    cycle: false

    # Joint order used for every waypoint below
    joint_names:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

    # Visit order
    waypoint_names: [home, pick, place, home]

    # Joint positions in radians
    waypoints:
      home:  [0.0, -1.57, 0.0, -1.57, 0.0, 0.0]
      pick:  [0.8, -1.1, 1.4, -1.9, -1.57, 0.0]
      place: [-0.8, -1.1, 1.4, -1.9, -1.57, 0.0]
