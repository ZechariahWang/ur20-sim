main_sweep:
  ros__parameters:
    planning_group: ur_manipulator
    # Fraction (0-1] of maximum joint velocity/acceleration.
    velocity_scaling: 0.05
    acceleration_scaling: 0.1

    # The sweep line runs parallel to the base Y axis at fixed x/z (m,
    # ROS base frame: open workspace is +x, wall behind the robot is -x).
    sweep_x: 1.0
    # CAMERA TIP heights ABOVE THE REAL FLOOR (m). The board is ~40 mm
    # tall: the top pass looks down on it, the side pass flies just above
    # board-top height to capture the side without touching the ground.
    # The flange offset for the 22 cm camera is applied automatically.
    top_pass_height: 0.30
    side_pass_height: 0.10

    # How far the camera tip sticks out of the flange along tool z (m).
    camera_length: 0.22
    # Both sweeps travel from sweep_y_start to sweep_y_end; swap the two
    # values to flip the sweep direction.
    sweep_y_start: 0.9
    sweep_y_end: -0.9

    # Cartesian interpolation step along the line (m).
    eef_step: 0.01

    # Closest any scripted TCP position may be to the ceiling or a wall
    # (m). The node refuses to start if the script violates this.
    # Room bounds themselves come from room.yaml.
    room_margin: 0.15
    # Separate, smaller margin for the floor so the side pass may fly low
    # (m). The TCP may never be closer to the floor than this.
    floor_margin: 0.03

    # The routine first moves here (radians, shoulder_pan..wrist_3), the
    # robot's parked pose, so every run starts from the same place.
    park_joints: [-0.2039, -1.1884, 2.0029, -2.3604, -1.5605, 0.8880]

    # Joint pose whose TCP orientation ("forwards and upside down", jogged
    # on the pendant 2026-08-17) is used for the second/side pass. The
    # position of this pose is ignored, only its orientation is used.
    side_view_joints: [-0.2419, -0.8502, 2.0817, -4.3216, -1.3280, 4.1860]
