main_sweep:
  ros__parameters:

    planning_group: ur_manipulator
    velocity_scaling: 0.05  # Fraction (0-1] of maximum joint velocity/acceleration.
    acceleration_scaling: 0.1

    sweep_x: 1.2
    top_pass_height: 0.57
    side_pass_height: 0.25

    camera_length: 0.22  # How far the camera tip sticks out of the flange along tool z (m).
    sweep_y_start: 0.9
    sweep_y_end: -0.9

    eef_step: 0.01
    pose_pause_seconds: 2.0

    # Oblique view shift relative to the jogged pose
    # (x trimmed 0.75 -> 0.65 on 2026-08-19: oblique 10 cm closer to the robot)
    oblique_shift_x: 0.65
    oblique_shift_y: 0.62
    oblique_shift_z: -0.06

    # Closest any scripted TCP position may be to the ceiling or a wall, and wall
    room_margin: 0.15
    floor_margin: 0.03

    # The routine first moves here (radians, shoulder_pan..wrist_3), the robot's parked pose
    park_joints: [-0.1720, -0.6719, 1.7296, -2.6034, -1.5591, 0.9208]

    # Joint pose whose TCP orientation is used for the second/side pass. only its orientation is used.
    side_view_joints: [-0.2419, -0.8502, 2.0817, -4.3216, -1.3280, 4.1860]

    # Final oblique view after both passes
    oblique_view_joints: [-1.4336, -0.3388, 1.3064, -1.6788, -0.9463, 1.4467]

    # Pose for the "angled" sweep 
    angled_view_joints: [-0.2274, -0.1974, 1.8953, -4.1178, -1.4216, 4.0635]
